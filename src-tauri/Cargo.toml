[package]
name = "fntv-tauri"
version = "2.6.1"
description = "飞牛影视 - FN TV Media Player"
authors = ["tracing"]
edition = "2021"

[lib]
name = "fntv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "process", "rt-multi-thread", "macros", "net", "io-util"] }
log = "0.4"

# FN API 通訊與密碼加密（設定檔/登入管理）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
md-5 = "0.10"
hex = "0.4"
percent-encoding = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"

# 跨平台進程存活檢測（Unix kill syscall）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 11 Snap Layouts 支援（WM_NCHITTEST 攔截）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
